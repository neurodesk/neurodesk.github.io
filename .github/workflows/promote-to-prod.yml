name: Promote to Production

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to promote (default: main)"
        required: false
        default: "main"
      include_edu:
        description: "Include neurodeskedu in this promotion"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-22.04
    env:
      PROD_OWNER: "neurodesk"
      PROD_REPO: "neurodesk.org"
      PROD_BRANCH: "site"
    steps:
      - name: Checkout (staging)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Node and Python
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          npm ci || npm install
          python -m pip install --upgrade pip
          pip install requests google-auth matplotlib

      - name: Test user metrics generator
        run: python -m unittest tests/test_write_user_metrics.py

      - name: Build applications index (applist.json)
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          set -e
          if [ -n "$ZENODO_TOKEN" ]; then
            echo "ZENODO_TOKEN present — generating applist.json via script"
            python .github/workflows/write-app-json.py --zenodo_token "$ZENODO_TOKEN"
          else
            echo "ZENODO_TOKEN not set — falling back to staging index.json"
            # Best-effort fallback so prod still has application data
            mkdir -p public/data
            if curl -fsSL https://neurodesk.github.io/data/applist.json -o /tmp/applist.json; then
              cp /tmp/applist.json public/data/applist.json
              echo "Fetched staging applist.json and wrote to public/data/applist.json"
            else
              echo "Warning: could not fetch staging applist.json; Applications page may be empty"
            fi
          fi

      - name: Build user metrics
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "$GA4_SERVICE_ACCOUNT_KEY" ]; then
            python .github/workflows/write-user-metrics.py
          else
            echo "GA4_SERVICE_ACCOUNT_KEY not set — writing unavailable placeholder"
            python .github/workflows/write-user-metrics.py --allow-missing-token
          fi

      - name: Build Neurodesk App download metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/workflows/write-neurodeskapp-metrics.py

      - name: Build with Astro (prod site)
        run: |
          npx astro build --site "https://neurodesk.org"
          echo "neurodesk.org" > dist/CNAME

      - name: Verify Applications JSON (non-empty)
        run: |
          set -e
          if [ ! -f dist/data/applist.json ]; then
            echo "dist/data/applist.json missing; Applications page will be empty"
            exit 1
          fi
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('dist/data/applist.json','utf8'));const n=Array.isArray(d.list)?d.list.length:0;console.log('Applications in applist.json:',n);if(n===0){process.exit(1)}"

      - name: Include example-notebooks (clone gh-pages branch)
        run: |
          set -e
          NOTEBOOKS_DIR="${GITHUB_WORKSPACE}/dist/example-notebooks"
          mkdir -p "$NOTEBOOKS_DIR"

          echo "Cloning example-notebooks repo gh-pages branch..."
          git clone --depth=1 --branch gh-pages https://github.com/neurodesk/example-notebooks.git /tmp/example-notebooks

          echo "Copying example-notebooks HTML into dist/example-notebooks/..."
          # Copy all files from gh-pages root into dist/example-notebooks/
          # Skip git/repo metadata
          cp -r /tmp/example-notebooks/* "$NOTEBOOKS_DIR/" || true

          # Verify some key files exist
          if [ -f "$NOTEBOOKS_DIR/intro.html" ]; then
            echo "✓ intro.html found in dist/example-notebooks/"
          else
            echo "⚠ Warning: intro.html not found — notebooks may not have copied correctly"
          fi

      - name: Include neurodeskedu (clone gh-pages branch)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_edu }}
        run: |
          set -e
          EDU_DIR="${GITHUB_WORKSPACE}/dist/edu"
          mkdir -p "$EDU_DIR"

          echo "Cloning neurodeskedu repo gh-pages branch..."
          git clone --depth=1 --branch gh-pages https://github.com/neurodesk/neurodeskedu.git /tmp/neurodeskedu

          echo "Copying neurodeskedu HTML into dist/edu/..."
          # Copy all files from gh-pages root into dist/edu/
          # Skip git/repo metadata
          cp -r /tmp/neurodeskedu/* "$EDU_DIR/" || true

          # Verify some key files exist
          if [ -f "$EDU_DIR/intro.html" ] || [ -f "$EDU_DIR/index.html" ]; then
            echo "✓ neurodeskedu static files found in dist/edu/"
          else
            echo "⚠ Warning: intro.html not found — neurodeskedu may not have copied correctly"
          fi

      - name: Checkout neurocontainers-ui (source)
        run: |
          set -e
          mkdir -p "${GITHUB_WORKSPACE}/.tmp"
          git clone --depth=1 https://github.com/neurodesk/neurocontainers-ui.git "${GITHUB_WORKSPACE}/.tmp/neurocontainers-ui"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/.tmp/neurocontainers-ui/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('.tmp/neurocontainers-ui/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Build neurocontainers-ui (export)
        working-directory: ${{ github.workspace }}/.tmp/neurocontainers-ui
        run: |
          set -e
          bun install
          # NOTE: Next.js expects basePath without a trailing slash
          PAGES_BASE_PATH="/neurocontainers-ui" bun run build
          echo "Built output (out/):"
          ls -la out || true

      - name: Copy neurocontainers-ui to dist
        env:
          UI_DIR: ${{ github.workspace }}/dist/neurocontainers-ui
        run: |
          set -e
          mkdir -p "$UI_DIR"
          rsync -av --delete "${GITHUB_WORKSPACE}/.tmp/neurocontainers-ui/out/" "$UI_DIR/"
          if [ -f "$UI_DIR/index.html" ]; then
            echo "✓ neurocontainers-ui built and copied successfully"
          else
            echo "⚠ Warning: neurocontainers-ui build failed or output not found"
            ls -la "$UI_DIR" || true
            exit 1
          fi

      - name: Push built site to prod repo
        env:
          GH_TOKEN: ${{ secrets.PROD_REPO_TOKEN }}
          INCLUDE_EDU: ${{ github.event_name != 'workflow_dispatch' || inputs.include_edu }}
        run: |
          set -e
          WORK=/tmp/prod-site
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"
          git init
          git config user.name "staging-promotion-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ env.PROD_OWNER }}/${{ env.PROD_REPO }}.git"
          # Prepare target branch locally (create if it doesn't exist)
          git fetch origin "${{ env.PROD_BRANCH }}" || true
          if git ls-remote --exit-code --heads origin "${{ env.PROD_BRANCH }}" >/dev/null 2>&1; then
            git checkout -B "${{ env.PROD_BRANCH }}" "origin/${{ env.PROD_BRANCH }}"
          else
            git checkout --orphan "${{ env.PROD_BRANCH }}"
          fi
          # Sync built files into repo root, but NEVER delete .git
          if [ "${INCLUDE_EDU}" = "true" ]; then
            echo "Including edu in this promotion"
            rsync -av --delete --exclude='.git' "${GITHUB_WORKSPACE}/dist/" ./
          else
            echo "Preserving existing edu content in prod (include_edu=false)"
            rsync -av --delete --exclude='.git' --exclude='edu/' "${GITHUB_WORKSPACE}/dist/" ./
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy from $GITHUB_REPOSITORY@$GITHUB_SHA"
            git push -u origin "${{ env.PROD_BRANCH }}"
          fi

      - name: Trigger production deploy workflow
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PROD_REPO_TOKEN }}
        run: |
          # Fire repository_dispatch to prod to publish the 'site' branch content
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/${{ env.PROD_OWNER }}/${{ env.PROD_REPO }}/dispatches \
            -d '{"event_type":"publish-site","client_payload":{}}'
