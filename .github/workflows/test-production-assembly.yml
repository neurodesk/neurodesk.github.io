name: Test production EDU assembly

on:
  pull_request:
    paths:
      - '.github/workflows/promote-to-prod.yml'
      - '.github/workflows/test-production-assembly.yml'
      - 'tests/test_promote_edu.py'
      - '.github/workflows/check-site-size.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-to-prod.yml'
      - '.github/workflows/test-production-assembly.yml'
      - 'tests/test_promote_edu.py'
      - '.github/workflows/check-site-size.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: python -m unittest tests/test_promote_edu.py -v
