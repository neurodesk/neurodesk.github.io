name: Cloudflare preview links

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  checks: read
  contents: read
  pull-requests: write

jobs:
  preview-links:
    name: Wait for Cloudflare preview
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Add preview links to PR description
        uses: actions/github-script@v9
        with:
          script: |
            const project = 'neurodesk-github-io-astro';
            const startMarker = '<!-- cloudflare-preview:start -->';
            const endMarker = '<!-- cloudflare-preview:end -->';
            const pendingBlock = [
              startMarker,
              '> [!NOTE]',
              '> **Preview deployment pending**',
              '>',
              '> This panel updates automatically when Cloudflare finishes building the preview.',
              endMarker,
            ].join('\n');
            const managedSection = new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`);

            function branchAlias(ref) {
              return ref
                .toLowerCase()
                .replace(/[^a-z0-9]/g, '-')
                .slice(0, 28)
                .replace(/^-+|-+$/g, '');
            }

            function cloudflareBlock(pr, check) {
              const deploymentId = check.details_url?.match(/\/([0-9a-f-]{36})$/i)?.[1];
              if (!deploymentId) {
                core.setFailed(`Could not extract a Cloudflare deployment ID from ${check.details_url}`);
                return null;
              }

              const previewUrl = `https://${deploymentId.substring(0, 8)}.${project}.pages.dev`;
              const branchUrl = `https://${branchAlias(pr.head.ref)}.${project}.pages.dev`;

              if (check.conclusion !== 'success') {
                return [
                  startMarker,
                  '> [!WARNING]',
                  '> **Preview deployment failed**',
                  '>',
                  `> [View deployment logs](${check.details_url})`,
                  endMarker,
                ].join('\n');
              }

              return [
                startMarker,
                '> [!IMPORTANT]',
                '> **Preview ready**',
                '>',
                `> [Open latest branch preview](${branchUrl}) · [Open this commit](${previewUrl}) · [View deployment logs](${check.details_url})`,
                '',
                '| | |',
                '|---|---|',
                `| Commit | \`${check.head_sha.substring(0, 7)}\` |`,
                '| Status | ✅ Deploy successful |',
                endMarker,
              ].join('\n');
            }

            function updateManagedSection(body, block) {
              const current = body || '';
              const replacement = block || pendingBlock;
              if (managedSection.test(current)) {
                return current.replace(managedSection, replacement);
              }
              return `${replacement}\n\n${current}`;
            }

            const normalizeNewlines = value => value.replace(/\r\n/g, '\n');

            async function updateDescription(pr, block) {
              const body = updateManagedSection(pr.body, block);
              if (normalizeNewlines(body) === normalizeNewlines(pr.body || '')) {
                core.info(`PR #${pr.number} description is already current`);
                return;
              }

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body,
              });
            }

            async function waitForCloudflare(sha) {
              for (let attempt = 1; attempt <= 60; attempt += 1) {
                const { data } = await github.rest.checks.listForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: sha,
                  check_name: 'Cloudflare Pages',
                  filter: 'latest',
                  per_page: 100,
                });
                const check = data.check_runs.find(
                  run => run.app?.slug === 'cloudflare-workers-and-pages'
                );
                if (check?.status === 'completed') return check;

                core.info(`Waiting for Cloudflare Pages (${attempt}/60)`);
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
              return null;
            }

            async function reconcile(prNumber) {
              let { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });

              await updateDescription(pr, null);

              const check = await waitForCloudflare(pr.head.sha);
              if (!check) {
                core.setFailed(`Timed out waiting for Cloudflare Pages on ${pr.head.sha}`);
                return;
              }

              const block = cloudflareBlock(pr, check);
              if (!block) return;

              ({ data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              }));
              await updateDescription(pr, block);

              if (check.conclusion !== 'success') {
                core.setFailed(`Cloudflare Pages finished with ${check.conclusion}`);
                return;
              }

              core.info(`Updated Cloudflare preview links on PR #${prNumber}`);
            }

            await reconcile(context.payload.pull_request.number);
