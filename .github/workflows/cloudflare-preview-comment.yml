name: Cloudflare preview links

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  check_run:
    types: [completed]

permissions:
  checks: read
  contents: read
  pull-requests: write

jobs:
  preview-links:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.check_run.name == 'Cloudflare Pages' &&
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages')
    runs-on: ubuntu-24.04
    steps:
      - name: Add preview links to PR description
        uses: actions/github-script@v9
        with:
          script: |
            const project = 'neurodesk-github-io-astro';
            const startMarker = '<!-- cloudflare-preview:start -->';
            const endMarker = '<!-- cloudflare-preview:end -->';
            const managedSection = new RegExp(
              `\\n\\n---\\n\\n${startMarker}[\\s\\S]*?${endMarker}`
            );

            function branchAlias(ref) {
              return ref
                .toLowerCase()
                .replace(/[^a-z0-9]/g, '-')
                .slice(0, 28)
                .replace(/^-+|-+$/g, '');
            }

            function cloudflareBlock(pr, check) {
              const deploymentId = check.details_url?.match(/\/([0-9a-f-]{36})$/i)?.[1];
              if (!deploymentId) {
                core.setFailed(`Could not extract a Cloudflare deployment ID from ${check.details_url}`);
                return null;
              }

              const previewUrl = `https://${deploymentId.substring(0, 8)}.${project}.pages.dev`;
              const branchUrl = `https://${branchAlias(pr.head.ref)}.${project}.pages.dev`;
              const status = check.conclusion === 'success'
                ? '&nbsp;✅&nbsp; Deploy successful!'
                : `&nbsp;❌&nbsp; Deploy ${check.conclusion || 'failed'}`;

              return [
                startMarker,
                `## Deploying ${project} with &nbsp;<a href="https://pages.dev"><img alt="Cloudflare Pages" src="https://user-images.githubusercontent.com/23264/106598434-9e719e00-654f-11eb-9e59-6167043cfa01.png" width="16"></a> &nbsp;Cloudflare Pages`,
                '',
                '<table><tr><td><strong>Latest commit:</strong> </td><td>',
                `<code>${check.head_sha.substring(0, 7)}</code>`,
                '</td></tr>',
                `<tr><td><strong>Status:</strong></td><td>${status}</td></tr>`,
                '<tr><td><strong>Preview URL:</strong></td><td>',
                `<a href='${previewUrl}'>${previewUrl}</a>`,
                '</td></tr>',
                '<tr><td><strong>Branch Preview URL:</strong></td><td>',
                `<a href='${branchUrl}'>${branchUrl}</a>`,
                '</td></tr>',
                '</table>',
                '',
                `[View logs](${check.details_url})`,
                endMarker,
              ].join('\n');
            }

            function updateManagedSection(body, block) {
              const current = body || '';
              if (!block) return current.replace(managedSection, '');
              if (managedSection.test(current)) {
                return current.replace(managedSection, `\n\n---\n\n${block}`);
              }
              return `${current.trimEnd()}\n\n---\n\n${block}`;
            }

            async function reconcile(prNumber) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });

              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
                check_name: 'Cloudflare Pages',
                filter: 'latest',
                per_page: 100,
              });
              const check = data.check_runs.find(run =>
                run.status === 'completed' &&
                run.app?.slug === 'cloudflare-workers-and-pages'
              );
              const block = check ? cloudflareBlock(pr, check) : null;
              if (check && !block) return;

              const body = updateManagedSection(pr.body, block);
              if (body === (pr.body || '')) {
                core.info(`PR #${prNumber} description is already current`);
                return;
              }

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                body,
              });
              core.info(check
                ? `Updated Cloudflare preview links on PR #${prNumber}`
                : `Removed stale Cloudflare preview links from PR #${prNumber}`
              );
            }

            if (context.eventName === 'pull_request_target') {
              await reconcile(context.payload.pull_request.number);
              return;
            }

            const pullRequests = context.payload.check_run.pull_requests || [];
            if (pullRequests.length === 0) {
              core.info('The check completed before a PR existed; the PR event will reconcile it later');
              return;
            }

            for (const pr of pullRequests) {
              await reconcile(pr.number);
            }
