name: PR Preview Reminder

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  preview-bot:
    runs-on: ubuntu-22.04
    steps:
      - name: Remind contributor to check preview
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            const headRef = context.payload.pull_request.head.ref;

            const marker = '<!-- pr-preview:neurodesk -->';
            const commentBody = [
              marker,
              '## Preview Deployment',
              '',
              'Cloudflare Pages will automatically build and deploy a preview for this PR.',
              'The Cloudflare bot will comment below with the preview URL once ready.',
              '',
              'Quick contributor self-check (please confirm before requesting reviewers):',
              '- [ ] Visual layout looks correct',
              '- [ ] Links and images load as expected',
              '- [ ] Please verify that recent changes were applied correctly',
              '',
              'Note: Depending on repository permissions, some users (for example, contributors from forked repositories) may not be able to toggle these checkboxes. If you can\'t check them, please react with a thumbs-up.',
              '',
              'If this looks good, please react with a thumbs-up to this comment.',
              'This signals to maintainers that the preview has been validated and is ready for review.',
              '',
              '<details>',
              '<summary>Build Details</summary>',
              '',
              `- Commit: ${headSha.substring(0, 7)}`,
              `- Branch: \`${headRef}\``,
              '- Deployed by: Cloudflare Pages',
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });

            const botComment = comments.find(comment => comment.body && comment.body.includes(marker));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
              core.info('Updated existing preview reminder comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
              core.info('Created new preview reminder comment');
            }
