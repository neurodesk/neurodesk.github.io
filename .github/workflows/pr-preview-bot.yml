name: PR Preview Reminder

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  preview-bot:
    runs-on: ubuntu-22.04
    steps:
      - name: Remind contributor to check preview
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            const headRef = context.payload.pull_request.head.ref;

            // Cloudflare Pages branch alias: lowercase, non-alphanumeric to hyphen, 28 chars
            const alias = headRef.toLowerCase().replace(/[^a-z0-9]/g, '-').slice(0, 28).replace(/^-+|-+$/g, '');
            const previewUrl = `https://${alias}.neurodesk-github-io-astro.pages.dev/`;

            const marker = '<!-- pr-preview:neurodesk -->';
            const commentBody = [
              marker,
              '## Preview Deployment',
              '',
              `### :arrow_right: [Open the preview site](${previewUrl})`,
              '',
              `\`${previewUrl}\``,
              '',
              'This branch link follows your latest commit, so it stays correct as you push more.',
              '',
              'For a specific build, scroll to the comment from `cloudflare-workers-and-pages` and use its',
              '**Preview URL** row. Its **Branch Preview URL** row is the same link as above.',
              '',
              'Wait for :white_check_mark: **Deploy successful** in that comment before trusting what you see.',
              'A 404 or a stale page usually means the build is still running, so wait a moment and refresh.',
              '',
              'Quick contributor self-check (please confirm before requesting reviewers):',
              '- [ ] Visual layout looks correct',
              '- [ ] Links and images load as expected',
              '- [ ] Please verify that recent changes were applied correctly',
              '',
              'Note: Depending on repository permissions, some users (for example, contributors from forked repositories) may not be able to toggle these checkboxes. If you can\'t check them, please react with a thumbs-up.',
              '',
              'If this looks good, please react with a thumbs-up to this comment.',
              'This signals to maintainers that the preview has been validated and is ready for review.',
              '',
              '<details>',
              '<summary>Build Details</summary>',
              '',
              `- Commit: ${headSha.substring(0, 7)}`,
              `- Branch: \`${headRef}\``,
              '- Deployed by: Cloudflare Pages',
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });

            const botComment = comments.find(comment => comment.body && comment.body.includes(marker));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
              core.info('Updated existing preview reminder comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
              core.info('Created new preview reminder comment');
            }
